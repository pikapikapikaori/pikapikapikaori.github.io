name: Sitemap

on:
  push:
    branches-ignore:
      - master
    paths:
      - "docs/**/*.md"
      - "script/shell/sitemap.sh"
      - "!docs/assets/**"
      - "!docs/pages/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Sitemap
        run: bash ./script/shell/sitemap.sh

      - name: Commit Updated
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "action: build sitemap.xml"
          file_pattern: "docs/assets/resources/meta/sitemap.xml"
