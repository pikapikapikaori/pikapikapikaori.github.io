<!DOCTYPE html>
<html lang="zh-Hans" data-theme="light" data-theme-mode="auto">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>导航页 · ピカピカピ</title>
    <meta name="description" content="个人网站导航页">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/x-icon" href="./assets/resources/logo/favicon.ico">
    <link rel="manifest" href="./assets/resources/meta/manifest.json">
    <meta name="theme-color" content="#f7f3ea">
    <script src="./assets/js/worker/startup.js"></script>
    <link rel="stylesheet" href="./assets/css/styles.css">
    <script type="module" src="./assets/js/app.js"></script>
</head>

<body>
    <header class="page-head">
        <div class="wrap">
            <div class="masthead">
                <div class="identity">
                    <h1 class="site-title" id="site-title"></h1>
                </div>
                <div class="head-side">
                    <p class="today">
                        <span id="greeting"></span>
                        <span class="today-sep" aria-hidden="true"></span>
                        <time id="today-date"></time>
                    </p>
                    <div class="theme-switch" id="theme-switch" role="group" aria-label="">
                        <button type="button" data-theme-mode="auto" aria-pressed="true"></button>
                        <button type="button" data-theme-mode="light" aria-pressed="false"></button>
                        <button type="button" data-theme-mode="dark" aria-pressed="false"></button>
                    </div>
                </div>
            </div>

        </div>
    </header>

    <div class="head-stick" data-head-stick>
        <div class="wrap">
            <label class="search-label" for="search-input"></label>
            <div class="search-root" data-search>
                <input class="search-input" id="search-input" type="text" inputmode="search" autocomplete="off"
                    autocapitalize="off" spellcheck="false" role="combobox" aria-autocomplete="list"
                    aria-expanded="false" aria-controls="search-list" aria-haspopup="listbox" placeholder="">
                <div class="search-results" id="search-results" hidden>
                    <div class="search-list" id="search-list" role="listbox" aria-label=""></div>
                    <div id="search-note"></div>
                </div>
            </div>

            <div class="head-under" data-head-under>
                <section class="apps head-apps" aria-labelledby="apps-title">
                    <h2 class="sr-only" id="apps-title"></h2>
                    <ul class="apps-list" id="apps-list"></ul>
                </section>

                <nav class="toc" aria-label="">
                    <div class="rail-row">
                        <span class="rail-role" id="rail-role-primary" aria-hidden="true"></span>
                        <div class="rail-wrap">
                            <div class="rail" id="primary-rail" role="group" aria-label=""></div>
                        </div>
                    </div>
                    <div class="rail-row">
                        <span class="rail-role" id="rail-role-secondary" aria-hidden="true"></span>
                        <div class="rail-wrap">
                            <div class="rail rail-sub" id="secondary-rail" role="group" aria-label=""></div>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
        <span class="head-fade" aria-hidden="true"></span>
    </div>

    <main class="page-main" id="main" tabindex="-1">
        <div class="wrap">
            <p class="sr-only" id="new-window-note"></p>
            <section class="group" id="group-panel" aria-label="" aria-busy="true">
                <p class="loading" id="loading-note"></p>
            </section>
        </div>
    </main>

    <footer class="page-foot">
        <div class="wrap foot-line">
            <p id="copyright"></p>
        </div>
    </footer>

    <div class="sr-only" id="live-region" role="status" aria-live="polite"></div>
</body>

</html>
