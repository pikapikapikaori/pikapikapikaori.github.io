<!DOCTYPE html>

                data-flip>
                <div class="flip-inner">
                    <div class="flip-face flip-front">
                        <span class="cell-title">李亦楊</span>
                        <span class="cell-subtitle">&copy; 2023 - 2026</span>
                        <span class="flip-hint">↻</span>
                    </div>
                    <div class="flip-face flip-back">
                        <span class="cell-title">關於我</span>
                        <span class="flip-back-text">
                            歡迎訪問我的個人主頁。<br>
                            想成為一個愛智慧、愛美的人。

                </div>
            </div>

            <a class="cell cell-blue link-cell-same area-blue" href="mailto:Lyy8759@outlook.com" aria-label="聯繫我"

            <div class="cell cell-white flip-card area-white-left" tabindex="0" role="button" aria-label="語言，點擊翻轉查看詳情"
                data-flip>
                <div class="flip-inner">
                    <div class="flip-face flip-front">
                        <span class="cell-title">語言</span>
                        <span class="translate-icon">🌐︎</span>
                        <span class="flip-hint">↻</span>
                    </div>
                    <div class="flip-face flip-back">
                        <span class="cell-title">語言</span>
                        <span class="flip-back-text">
                            中文<br>
                            <a href="./i18n/en-us.html">English</a><br>

                    </div>
