<div class="photography-layout">
    <header class="pg-head">
        <div class="pg-heading">
            <p class="pg-kicker" data-i18n="common.kicker"></p>
            <h1 class="pg-title" data-i18n-html="common.name"></h1>
            <p class="pg-intro" data-i18n="common.tagline"></p>
        </div>
    </header>

    <div class="pg-stage" data-stage>
        <div class="pg-track" data-track tabindex="0" role="region"
            data-i18n-attr="aria-label:common.photo.label"></div>
    </div>

    <footer class="pg-foot">
        <nav class="pg-links" data-i18n-attr="aria-label:photography.links.aria">
            <a data-i18n="common.blog.label" data-i18n-attr-href="common.blog.href"
                target="_blank" rel="noopener"></a>
            <a data-i18n="common.feed.label" data-i18n-attr-href="common.feed.href"
                target="_blank" rel="noopener"></a>
            <a data-link="email" data-i18n="common.email.label"></a>
        </nav>
        <div class="pg-progress" aria-hidden="true">
            <span class="pg-progress-bar" data-progress></span>
        </div>
        <p class="pg-copyright" data-i18n-html="common.footer.copyright"></p>
        <div class="pg-controls" data-slot="controls"></div>
    </footer>
</div>
