<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
    <title></title>
    <meta name="description" content="">
    <meta name="keywords" content="">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

    <div class="mondrian-wrapper" role="main" data-i18n-attr="aria-label:aria.main">

        <div class="mondrian-grid">

            <div class="cell cell-red flip-card area-red" tabindex="0" role="button"
                data-i18n-attr="aria-label:about.aria" data-flip>
                <div class="flip-inner">
                    <div class="flip-face flip-front">
                        <span class="cell-title" data-i18n-html="hero.name"></span>
                        <span class="cell-subtitle" data-i18n="hero.tagline"></span>
                        <span class="flip-hint"></span>
                    </div>
                    <div class="flip-face flip-back">
                        <span class="cell-title" data-i18n="about.title"></span>
                        <span class="flip-back-text" data-i18n-html="about.text"></span>
                        <span class="flip-hint flip-hint-back"></span>
                    </div>
                </div>
            </div>

            <a class="cell cell-blue link-cell-same area-blue" href="mailto:Lyy8759@outlook.com"
                data-i18n-attr="aria-label:contact.aria,title:contact.aria">
                <span class="cell-title" data-i18n="contact.label"></span>
                <span class="arrow-indicator"></span>
            </a>

            <a class="cell cell-yellow link-cell area-yellow" target="_blank"
                rel="noopener noreferrer" data-i18n-attr="href:photo.href,aria-label:photo.aria,title:photo.aria">
                <span class="cell-title" data-i18n="photo.label"></span>
                <span class="arrow-indicator"></span>
            </a>

            <div class="cell cell-white flip-card area-white-left" tabindex="0" role="button"
                data-i18n-attr="aria-label:lang.aria" data-flip>
                <div class="flip-inner">
                    <div class="flip-face flip-front">
                        <span class="cell-title" data-i18n="lang.title"></span>
                        <span class="translate-icon"></span>
                        <span class="flip-hint"></span>
                    </div>
                    <div class="flip-face flip-back">
                        <span class="cell-title" data-i18n="lang.title"></span>
                        <span class="flip-back-text">
                            <a data-lang="zh-Hant"></a><br>
                            <a data-lang="en"></a><br>
                            <a data-lang="ja"></a>
                        </span>
                        <span class="translate-icon"></span>
                        <span class="flip-hint flip-hint-back"></span>
                    </div>
                </div>
            </div>

            <a class="cell cell-white link-cell area-white-2" target="_blank" rel="noopener noreferrer"
                data-i18n-attr="href:blog.href,aria-label:blog.aria,title:blog.aria">
                <span class="cell-title" data-i18n="blog.label"></span>
                <span class="arrow-indicator"></span>
            </a>

            <div class="cell cell-white cell-static area-white-main">
                <span class="cell-title" data-i18n-html="quote.title"></span>
                <span class="cell-quote" data-i18n-html="quote.text"></span>
            </div>

            <div class="cell cell-white cell-static area-white-small">
                <img class="cell-logo" src="./assets/logo.jpg" data-i18n-attr="alt:logo.alt">
            </div>

        </div>
    </div>

    <footer class="copyright" id="copyright-script-generated" data-i18n-html="footer.copyright"></footer>

    <script src="./assets/js/i18n.js"></script>
    <script src="./assets/js/script.js"></script>
</body>

</html>
