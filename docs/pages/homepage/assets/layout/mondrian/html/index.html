<div class="mondrian-layout" role="main" data-i18n-attr="aria-label:common.main.aria">
    <div class="mondrian-stage">
        <div class="mondrian-frame">
            <div class="mondrian-grid">
                <div class="m-cell m-red m-flip area-red" tabindex="0" role="button"
                    aria-pressed="false" data-m-flip data-i18n-attr="aria-label:common.flip.open">
                    <div class="m-flip-inner">
                        <div class="m-face m-front">
                            <span class="m-slogan-text m-slogan-line" data-slogan></span>
                            <span class="m-hint" aria-hidden="true"></span>
                        </div>
                        <div class="m-face m-back">
                            <span class="m-title" data-i18n-html="common.aboutTitle"></span>
                            <span class="m-text" data-i18n="common.about.p1"></span>
                            <span class="m-text" data-i18n="common.about.p2"></span>
                            <span class="m-hint m-hint-back" aria-hidden="true"></span>
                        </div>
                    </div>
                </div>

                <a class="m-cell m-blue m-link area-blue" data-link="email"
                    data-i18n-attr="aria-label:common.email.label,title:common.email.label">
                    <span class="m-title" data-i18n="common.email.label"></span>
                    <span class="m-arrow m-arrow-same" aria-hidden="true"></span>
                </a>

                <a class="m-cell m-yellow m-link area-yellow" target="_blank" rel="noopener noreferrer"
                    data-i18n-attr="href:common.feed.href,aria-label:common.feed.label,title:common.feed.label">
                    <span class="m-title" data-i18n="common.feed.label"></span>
                    <span class="m-arrow" aria-hidden="true"></span>
                </a>

                <div class="m-cell m-white m-slogan area-white-left">
                    <span class="m-slogan-text" data-i18n="common.motto"></span>
                </div>

                <a class="m-cell m-white m-link area-white-2" target="_blank" rel="noopener noreferrer"
                    data-i18n-attr="href:common.blog.href,aria-label:common.blog.label,title:common.blog.label">
                    <span class="m-title" data-i18n="common.blog.label"></span>
                    <span class="m-arrow" aria-hidden="true"></span>
                </a>

                <div class="m-cell m-white m-static area-white-main">
                    <span class="m-title" data-i18n-html="common.quote.title"></span>
                    <span class="m-quote-text" data-i18n-html="common.quote.text"></span>
                </div>

                <div class="m-cell m-white m-static area-white-small">
                    <img class="m-logo" data-logo
                        data-i18n-attr="alt:common.avatarAlt">
                </div>
            </div>
        </div>
    </div>

    <div class="mondrian-plate">
        <div class="m-plate-left">
            <span class="m-plate-name" data-i18n-html="common.name"></span>
            <span class="m-plate-tagline" data-i18n="common.tagline"></span>
        </div>
        <div class="m-plate-controls" data-slot="controls"></div>
    </div>

    <footer class="mondrian-footer" data-i18n-html="common.footer.copyright"></footer>
</div>
