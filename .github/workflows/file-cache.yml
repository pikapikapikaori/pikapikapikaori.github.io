name: File Cache

on:
  push:
    branches-ignore:
      - master
    paths:
      - "docs/**"
      - "script/shell/file-cache.sh"
      - "!docs/**/file-cache.json"

permissions:
  contents: write

concurrency:
  group: meta-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Build File Cache
        run: bash ./script/shell/file-cache.sh

      - name: Check File Cache
        run: bash ./script/shell/file-cache.sh --check

      - name: Commit File Cache
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "action: build file-cache.json"
          file_pattern: "docs/**/file-cache.json"
