<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <title>干支纪年转换器</title>
    <meta name="description" content="查询公历日期对应的农历与干支。">
    <link rel="icon" href="./assets/resources/logo/favicon.ico">
    <link rel="stylesheet" href="./assets/css/ganzhi.css">
</head>

<body>
    <div class="calculatorContainer">
        <input id="calculatorInput" type="date" min="2000-01-01" max="2099-12-31">
        <div id="calculatorLunarOutput"></div>
        <div class="calculatorOutput" id="calculatorOutput">
            <div id="calculatorOutputYear"></div>
            <div id="calculatorOutputMonth"></div>
            <div id="calculatorOutputDay"></div>
        </div>
    </div>
    <script src="./assets/js/ganzhi.js"></script>

</html>
